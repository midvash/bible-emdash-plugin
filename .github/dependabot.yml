version: 2
updates:
  # The plugin's own dev tooling (tsdown, vitest, emdash, typescript, …).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    # Held back on purpose:
    # - emdash 1.x moved plugin tooling to @emdash-cms/plugin-cli, which needs
    #   an emdash-plugin.jsonc manifest. Migrate the plugin first, then lift
    #   emdash and astro (astro 7 comes with emdash 1.x) together.
    # - TypeScript 7 drops the classic API that tsdown uses to emit .d.ts.
    ignore:
      - dependency-name: "emdash"
        versions: [">=1.0.0"]
      - dependency-name: "astro"
        versions: [">=7.0.0"]
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: "chore(deps)"

  # Keep the GitHub Actions in CI/Release pinned-but-fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
