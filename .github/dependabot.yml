version: 2
updates:
  # The plugin's own dev tooling (tsdown, vitest, emdash, typescript, …).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    # Held back on purpose:
    # - TypeScript 7 drops the classic API that tsdown uses to emit .d.ts.
    # - zod is pinned to the exact version emdash pins (4.5.4 in emdash 1.x).
    #   A newer zod gives the mcp tool schemas in src/plugin.ts a second
    #   `_zod.version` and breaks typecheck (TS2322). Bump it by hand, together
    #   with emdash, to whatever `npm view emdash dependencies.zod` says.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "zod"
    commit-message:
      prefix: "chore(deps)"

  # Keep the GitHub Actions in CI/Release pinned-but-fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # A changesets/action major renames inputs and must match the
    # @changesets/cli major (v2 action = v3 CLI). Bump both by hand.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
